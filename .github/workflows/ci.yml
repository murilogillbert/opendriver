name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hub
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub?schema=opendriver
      HUB_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: murilogillbert/hub
          path: hub
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            hub/backend/package-lock.json
            mobile/package-lock.json
      # Banco igual ao de produção: primeiro as migrations do hub, depois as do OpenDriver.
      - name: Aplicar migrations do hub
        working-directory: hub/backend
        run: |
          npm ci
          DATABASE_URL=$HUB_DATABASE_URL DIRECT_URL=$HUB_DATABASE_URL npx prisma migrate deploy
      - run: npm ci
      - name: Aplicar migrations do OpenDriver
        run: |
          psql "$HUB_DATABASE_URL" -f prisma/bootstrap/001_migrations_table.sql
          npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub?schema=opendriver
      # E2E do app: a camada de dados do mobile (HTTP + Socket.IO) contra esta API.
      - name: Subir a API para o E2E do app
        run: |
          nohup npx tsx src/server.ts > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:5199/health && break; sleep 1; done
        env:
          NODE_ENV: test
          PORT: '5199'
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub?schema=opendriver
          JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
          RATE_LIMIT_AUTH_PERMIT: '10000'
          PAYMENT_PROVIDER: mock
          PAYMENT_WEBHOOK_REQUIRE_TOKEN: 'false'
          DISPATCH_OFFER_TIMEOUT_SECONDS: '15'
          STORAGE_DRIVER: local
          STORAGE_LOCAL_DIR: /tmp/od-e2e-storage
      - name: E2E do app contra a API
        working-directory: mobile
        run: |
          npm ci
          npm run test:e2e
        env:
          E2E_API_URL: http://localhost:5199
          E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hub

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Bundle iOS/Android (garante que todas as rotas compilam)
        run: npm run export:check
        env:
          EXPO_OFFLINE: '1'
